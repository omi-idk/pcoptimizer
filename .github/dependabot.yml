version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/PCOptimizer.Core
      - /src/PCOptimizer.App
      - /tests/PCOptimizer.Core.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
