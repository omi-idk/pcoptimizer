name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore PCOptimizer.slnx --locked-mode
      - run: dotnet build PCOptimizer.slnx -c Release --no-restore
      - run: dotnet test tests/PCOptimizer.Core.Tests -c Release --no-build --no-restore
      - name: Render actual WPF layout with illustrative data
        timeout-minutes: 3
        run: |
          dotnet restore tools/PCOptimizer.UiPreview/PCOptimizer.UiPreview.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/PCOptimizer.UiPreview/PCOptimizer.UiPreview.csproj -c Release --no-restore -- artifacts/ui-preview
      - name: Upload UI design screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PCOptimizer-ui-preview
          path: artifacts/ui-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Publish portable Windows x64 preview
        run: |
          dotnet publish src/PCOptimizer.App/PCOptimizer.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false "-p:NuGetLockFilePath=$env:RUNNER_TEMP/pcoptimizer-publish.lock.json" -o artifacts/PCOptimizer-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $deps = Get-Content artifacts/PCOptimizer-win-x64/PCOptimizer.App.deps.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($runtime in @('Microsoft.NETCore.App.Runtime.win-x64', 'Microsoft.WindowsDesktop.App.Runtime.win-x64')) {
            if (-not $deps.libraries.ContainsKey("runtimepack.$runtime/10.0.13")) {
              throw "Runtime version changed: verify and update the shipped official runtime notices before publishing."
            }
          }
          foreach ($notice in @('DOTNET-LICENSE.txt', 'DOTNET-THIRD-PARTY-NOTICES.txt', 'WPF-LICENSE.txt', 'WPF-THIRD-PARTY-NOTICES.txt')) {
            if (-not (Test-Path "artifacts/PCOptimizer-win-x64/licenses/runtime-10.0.13/$notice")) { throw "Missing runtime notice: $notice" }
          }
          Copy-Item docs/primera-prueba.md artifacts/PCOptimizer-win-x64/LEEME-PRIMERO.md
          Copy-Item SECURITY.md artifacts/PCOptimizer-win-x64/SECURITY.md
          Copy-Item docs/BENCHMARKING.md artifacts/PCOptimizer-win-x64/BENCHMARKING.md
          Copy-Item docs/RESOURCE_AND_GAMING_SESSIONS.md artifacts/PCOptimizer-win-x64/RESOURCE_AND_GAMING_SESSIONS.md
          New-Item -ItemType Directory -Path artifacts/PCOptimizer-win-x64/research -Force | Out-Null
          Copy-Item docs/research/WZCONTROL_REVIEW.md artifacts/PCOptimizer-win-x64/research/WZCONTROL_REVIEW.md
          Copy-Item docs/WZCONTROL_PARITY.md artifacts/PCOptimizer-win-x64/WZCONTROL_PARITY.md
          Copy-Item docs/PROCESS_WORKLOADS.md artifacts/PCOptimizer-win-x64/PROCESS_WORKLOADS.md
          Copy-Item docs/PERFORMANCE_INTELLIGENCE.md artifacts/PCOptimizer-win-x64/PERFORMANCE_INTELLIGENCE.md
          Copy-Item docs/PERFIL_PC_WARZONE.md artifacts/PCOptimizer-win-x64/PERFIL_PC_WARZONE.md
      - name: Upload portable preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PCOptimizer-windows-x64-preview
          path: artifacts/PCOptimizer-win-x64/
          if-no-files-found: error
          retention-days: 14
  codeql:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet restore PCOptimizer.slnx --locked-mode
      - run: dotnet build PCOptimizer.slnx -c Release --no-restore
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
